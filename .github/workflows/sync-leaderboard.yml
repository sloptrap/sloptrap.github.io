name: Sync Rule Rankings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync Worker Installs, GitHub Likes & Release Downloads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync leaderboard.json from Worker, Issues & Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ.get("GITHUB_REPOSITORY", "sloptrap/sloptrap.github.io")
          token = os.environ.get("GH_TOKEN", "")
          lb_path = Path("leaderboard.json")
          lb = json.loads(lb_path.read_text(encoding="utf-8"))

          def gh_get(url: str):
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "sloptrap-leaderboard-sync/1.0",
                  **({"Authorization": f"Bearer {token}"} if token else {}),
              })
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.loads(r.read().decode("utf-8"))

          # 1. Cloudflare Worker stats (window_days, active_installs, all_time_installs)
          endpoint = (lb.get("rankings_endpoint") or "").rstrip("/")
          active_map, all_time_map = {}, {}
          if endpoint:
              try:
                  req = urllib.request.Request(
                      f"{endpoint}/api/v1/rules/stats",
                      headers={"User-Agent": "sloptrap-leaderboard-sync/1.0"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as r:
                      st = json.loads(r.read().decode("utf-8"))
                  if int(st.get("window_days") or 0) > 0:
                      lb["active_window_days"] = int(st["window_days"])
                  active_map = st.get("active_installs") or {}
                  all_time_map = st.get("all_time_installs") or {}
              except Exception as exc:
                  print(f"Worker stats warning: {exc}")

          # 2. GitHub Issue thumbs-up likes
          likes_by_issue = {}
          try:
              issues = gh_get(f"https://api.github.com/repos/{repo}/issues?labels=leaderboard-rule&state=open&per_page=100")
              for iss in issues:
                  num = iss.get("number")
                  likes_by_issue[num] = int((iss.get("reactions") or {}).get("+1", 0))
          except Exception as exc:
              print(f"Issues warning: {exc}")

          # 3. GitHub Release .strule download counts
          dl_total, dl_ver = {}, {}
          try:
              releases = gh_get(f"https://api.github.com/repos/{repo}/releases?per_page=100")
              for rel in releases:
                  tag = rel.get("tag_name") or ""
                  for asset in rel.get("assets") or []:
                      name = asset.get("name") or ""
                      if name.endswith(".strule"):
                          rid = name[:-7]
                          cnt = int(asset.get("download_count") or 0)
                          dl_total[rid] = dl_total.get(rid, 0) + cnt
                          dl_ver[(rid, tag)] = cnt
          except Exception as exc:
              print(f"Releases warning: {exc}")

          for e in lb.get("entries", []):
              rid = e["rule_id"]
              ver = e["version"]
              tag = f"rule-{rid}-v{ver}"
              if rid in active_map:
                  e["active_installs"] = int(active_map[rid])
              if rid in all_time_map:
                  e["all_time_installs"] = max(int(all_time_map[rid]), int(e.get("active_installs", 0)))
              elif e.get("active_installs", 0) > e.get("all_time_installs", 0):
                  e["all_time_installs"] = int(e["active_installs"])
              if e.get("issue_number") in likes_by_issue:
                  e["likes"] = likes_by_issue[e["issue_number"]]
              if rid in dl_total:
                  e["downloads_total"] = dl_total[rid]
              if (rid, tag) in dl_ver:
                  e["downloads_version"] = dl_ver[(rid, tag)]

          lb["generated_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          encoded = json.dumps(lb, indent=2) + "\n"
          lb_path.write_text(encoded, encoding="utf-8")
          Path("leaderboard/leaderboard.json").write_text(encoded, encoding="utf-8")
          PY

      - name: Commit updated leaderboard if changed
        run: |
          if ! git diff --quiet leaderboard.json leaderboard/leaderboard.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add leaderboard.json leaderboard/leaderboard.json
            git commit -m "chore(leaderboard): sync rankings stats [skip ci]"
            git push
          fi
