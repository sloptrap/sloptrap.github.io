name: Sync Registry, Leaderboards & Lists

# 1. sync    (read-only token): pull community bundles and pre-matched lists from the Worker,
#            verify + fully audit them (untrusted wasm runs here, in wasmtime), regenerate
#            the leaderboards, and hand the result on as a patch.
# 2. publish (contents: write): check the patch touches only registry data, apply it,
#            re-audit statically, commit, then pull --rebase and retry the push (LOW-08).
# 3. deploy: GITHUB_TOKEN pushes do not trigger pages.yml, so call it here (INFO-04).
#
# Nothing here compiles or signs rules, and the workflow holds no secrets: the anonymous
# compile/sign pipeline runs in a private repository.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-leaderboard
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, verify and audit registry data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned, hash-checked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r .github/requirements-ci.txt

      - name: Sync community bundles, lists and leaderboards
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I scripts/sync_registry.py

      - name: Full audit of the result
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I scripts/audit_bundles.py

      - name: Export changes as a patch
        id: diff
        run: |
          set -euo pipefail
          git add -A .
          git diff --cached --binary --no-renames -- leaderboard.json leaderboard lists bundles/community > registry.patch
          if [ -s registry.patch ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- leaderboard.json leaderboard lists bundles/community
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No registry changes."
          fi

      - name: Upload patch
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-patch
          path: registry.patch
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Commit and push registry data
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-patch
          path: ${{ runner.temp }}/patch

      - name: Check the patch touches only registry data
        env:
          PATCH: ${{ runner.temp }}/patch/registry.patch
        run: |
          set -euo pipefail
          allowed='^(leaderboard\.json|leaderboard/index\.json|leaderboard/leaderboard\.json|leaderboard/(youtube|tiktok|pinterest)/leaderboard\.json|lists/manifest\.json|lists/(youtube|tiktok|pinterest)/[a-z0-9][a-z0-9_-]{1,63}\.txt|bundles/community/community-[a-z0-9_-]{1,54}\.strule)$'
          bad=0
          while IFS=$'\t' read -r _add _del path; do
            if ! printf '%s\n' "$path" | grep -Eq "$allowed"; then
              echo "::error::patch touches a path outside the registry data: $path"
              bad=1
            fi
          done < <(git apply --numstat -- "$PATCH")
          if grep -E '^(new file mode|new mode|old mode|deleted file mode) ' -- "$PATCH" | grep -Ev ' 100644$'; then
            echo "::error::patch changes file modes (symlinks/executables are not allowed)"
            bad=1
          fi
          exit "$bad"

      - name: Apply patch
        env:
          PATCH: ${{ runner.temp }}/patch/registry.patch
        run: git apply --index -- "$PATCH"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned, hash-checked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: -r .github/requirements-ci.txt

      # Signatures, schema, static wasm rules and leaderboard consistency, without running
      # the wasm in this job (it ran in the read-only job above).
      - name: Static re-audit
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I scripts/audit_bundles.py --static-only

      - name: Commit and push (pull --rebase and retry)
        id: push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(registry): sync leaderboards, community bundles and lists"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          for attempt in 1 2 3 4 5; do
            if git -c http.https://github.com/.extraheader="$auth" pull --rebase -q origin "$BRANCH" &&
               git -c http.https://github.com/.extraheader="$auth" push -q origin "HEAD:$BRANCH"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not push after 5 attempts"
          exit 1

  deploy:
    name: Deploy Pages
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}
